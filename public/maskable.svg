<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Maskable: full-bleed background (no rounding) and the glyph shrunk into the center safe zone
       so a launcher's circle/squircle mask never clips it. Coordinates are pre-scaled (0.7 about the
       glyph centroid) so no group transform is needed — most robust across rasterizers. -->
  <rect width="512" height="512" fill="#0b0f14" />
  <g fill="none" stroke-linejoin="round" stroke-linecap="round">
    <circle cx="181.8" cy="292.4" r="60.2" stroke="#31c48d" stroke-width="15.4" />
    <circle cx="330.2" cy="292.4" r="60.2" stroke="#31c48d" stroke-width="15.4" />
    <path d="M181.8 292.4 L239.2 194.4 H302.2 L330.2 292.4" stroke="#e6edf3" stroke-width="15.4" />
    <path d="M239.2 194.4 L214 159.4 H260.2" stroke="#e6edf3" stroke-width="15.4" />
    <circle cx="256" cy="292.4" r="10.5" fill="#31c48d" />
  </g>
</svg>
